# emails domain (hr) — DEFAULT subjects/bodies + type labels/tag descriptions.
email:
    password_reset:
        label: Promjena lozinke
        subject: 'Promjena lozinke — {site_name}'
        body: |
            <p>Bok,</p>
            <p>Zatražena je promjena lozinke za tvoj račun na {site_name}. Za postavljanje nove lozinke otvori poveznicu:</p>
            <p><a href="{reset_url}">{reset_url}</a></p>
            <p>Ako nisi ti zatražio/la promjenu, slobodno zanemari ovaj e-mail.</p>
            <p>{site_name}</p>
        tag:
            reset_url: Poveznica za postavljanje nove lozinke (obavezno).
            site_name: Naziv sajta.
    member_login:
        label: Poveznica za prijavu člana
        subject: 'Prijava na {site_name}'
        body: |
            <p>Bok,</p>
            <p>Evo poveznice za prijavu na {site_name}. Otvori je i pritisni gumb na stranici:</p>
            <p><a href="{login_url}">{login_url}</a></p>
            <p>Poveznica vrijedi jednom i istječe za otprilike pola sata. Ako je nisi tražio/la, slobodno zanemari ovaj e-mail — ništa nije stvoreno.</p>
            <p>{site_name}</p>
        tag:
            login_url: Poveznica koja prijavljuje člana (obavezno).
            site_name: Naziv sajta.
