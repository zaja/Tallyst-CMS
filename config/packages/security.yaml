security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email
        # Members. A SEPARATE provider from staff, deliberately: ^/admin is fail-open, so keeping
        # the two in one provider would mean a single forgotten lock could put a member in the
        # back-office. Member has no password — the e-mail link is the credential.
        member_provider:
            entity:
                class: App\Entity\Member
                property: email

    # ROLE_ADMIN inherits ROLE_EDITOR: existing admins keep full access automatically.
    role_hierarchy:
        ROLE_ADMIN: [ROLE_EDITOR]

    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        # ⚠ MUST come before `main`, which has no `pattern` and therefore matches everything.
        # Firewalls are matched in order, so declaring this second would mean it never runs.
        #
        # No form_login and no logout password check: there is no member password anywhere in the
        # system. Authentication happens in MemberAccountController, which confirms an e-mail link
        # and then logs the member in programmatically.
        member:
            pattern: ^/account
            lazy: true
            provider: member_provider
            # A separate context, so a member session and a staff session can never be mistaken
            # for one another in either direction.
            context: member
            custom_authenticators:
                - App\Security\MemberLoginLinkAuthenticator
            entry_point: App\Security\MemberLoginLinkAuthenticator
            # ⚠ 90 DAYS FROM LAST USE, not from sign-in. Symfony refreshes the token on every
            # request that uses it, so somebody who comes back weekly stays signed in and somebody
            # who disappears for three months asks for a new link. A member who comments or reads
            # regularly must not be sent to their inbox every visit.
            #
            # ⚠ The LINK stays short-lived (30 minutes) — that is a different thing. Long is the
            # SESSION; stretching the link would weaken the one credential there is.
            #
            # ⚠ 7776000 = 90 days, and MemberPruneCommand::SESSION_DAYS must say the same. The
            # command deletes the rows behind these sign-ins; set it shorter and members are signed
            # out early with nothing to explain it, set it longer and rows outlive what this
            # firewall will accept.
            #
            # `always_remember_me`: there is no "remember me" checkbox to tick. Proving the address
            # IS the sign-in, and it would be a strange question to ask after an e-mail round trip.
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 7776000
                path: /account
                always_remember_me: true
                token_provider:
                    service: App\Security\MemberSessionTokenProvider
            logout:
                path: member_logout
                target: member_login
        main:
            lazy: true
            provider: app_user_provider
            form_login:
                login_path: admin_login
                check_path: admin_login
                enable_csrf: true
                default_target_path: admin
            logout:
                path: admin_logout
                target: admin_login
            # Brute-force protection: throttles failed logins. Symfony registers TWO limiters —
            # local (username+IP, 5 / 15 min) AND global (IP only, 5×max = 25 / 15 min). A
            # successful login resets them. E-mail reset stays the escape hatch if locked out.
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'
            # TOTP 2FA (scheb): after the password, users with 2FA enabled hit the challenge
            # before full auth. The firewall is stateful (no `stateless: true`), so the
            # IS_AUTHENTICATED_2FA_IN_PROGRESS state survives in the session between steps.
            two_factor:
                auth_form_path: 2fa_login
                check_path: 2fa_login_check
                enable_csrf: true

    # Note: Only the *first* matching rule is applied.
    # ^/admin requires ROLE_EDITOR just to ENTER the back-office. Per-section access
    # (editor=content, admin=everything) is enforced on each controller via #[IsGranted]
    # — NOT here and NOT by hiding the menu. See CLAUDE.md "Roles & access".
    access_control:
        # A member's own pages. The login page must be reachable by someone who is not logged
        # in — that is its entire purpose — so it comes first, and the rest of /account demands a
        # proven member. ROLE_MEMBER is flat and inherits nothing, so it can never resolve to staff.
        - { path: ^/account/(login|link), roles: PUBLIC_ACCESS }
        - { path: ^/account, roles: ROLE_MEMBER }
        - { path: ^/admin/login, roles: PUBLIC_ACCESS }
        # Forgot-password flow must be reachable by someone who CAN'T log in — so PUBLIC,
        # and it MUST come before ^/admin (first-match) or it would demand ROLE_EDITOR.
        - { path: ^/admin/reset-password, roles: PUBLIC_ACCESS }
        # The 2FA challenge is reachable in the half-authenticated state (password OK, code
        # pending). MUST come before ^/admin (first-match) or ROLE_EDITOR would block it.
        - { path: ^/admin/2fa, roles: IS_AUTHENTICATED_2FA_IN_PROGRESS }
        - { path: ^/admin, roles: ROLE_EDITOR }

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
